[project]
name = "lista-trf"
version = "0.1.0"
description = "Sistema agentico para analise de listas de julgamento do TRF5"
requires-python = ">=3.11"
dependencies = [
    "python-docx>=1.2.0",
    "pydantic>=2.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "python-multipart>=0.0.20",
    "pymupdf>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lista_trf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "rede: testes que vao ao site da Corte IDH pela rede; ficam fora da corrida padrao (rodar com -m rede)",
]
